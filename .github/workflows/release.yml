name: Build & Release Pixie

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: macOS Build (x64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npx electron-builder --mac --x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/Pixie-*.dmg
            dist/Pixie-*.zip

  build-windows:
    name: Windows Build (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npx electron-builder --win --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/Pixie-*.exe

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: dist/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Pixie v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🐾 Pixie v${{ steps.version.outputs.VERSION }}

            Your adorable desktop companion!

            ### Downloads
            | Platform | File |
            |:---|:---|
            | **macOS** | Pixie-${{ steps.version.outputs.VERSION }}-mac-x64.dmg |
            | **macOS (portable)** | Pixie-${{ steps.version.outputs.VERSION }}-mac-x64.zip |
            | **Windows** | Pixie-${{ steps.version.outputs.VERSION }}-win-x64.exe |

            > macOS: Drag Pixie to Applications. Windows: Run the installer.
          files: |
            dist/Pixie-*.dmg
            dist/Pixie-*.zip
            dist/Pixie-*.exe
          make_latest: true
