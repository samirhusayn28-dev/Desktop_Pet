<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixie</title>
  <link rel="stylesheet" href="../assets/fonts/bubble-fonts.css">
  <link rel="stylesheet" href="../themes/themes.css">
  <link rel="stylesheet" href="../character/pet.css">
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="pet-root-container" class="pet-app-container">
    <!-- Speech Bubble Overlay (Strictly event-driven, starts empty & hidden) -->
    <div id="pet-speech-bubble" class="pet-speech-bubble" style="display: none;" data-has-message="false">
      <div class="bubble-topline">
        <span id="bubble-badge" class="bubble-badge" style="display: none;"></span>
        <button type="button" class="bubble-dismiss" data-bubble-action="dismiss" title="Dismiss" aria-label="Dismiss message">×</button>
      </div>
      <div id="bubble-text" class="bubble-text"></div>
      <div class="bubble-actions">
        <button type="button" class="bubble-action primary" data-bubble-action="open">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Open in panel</span>
        </button>
        <button type="button" class="bubble-action needs-message" data-bubble-action="copy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span>Copy</span>
        </button>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- The Layered Pet Container -->
    <div id="pet-viewport" class="pet-viewport">
      <!-- Pet SVG dynamically rendered by pet-controller.js -->
    </div>

    <!-- Quick Context Menu on Right Click -->
    <div id="quick-menu" class="quick-menu hidden" data-has-message="false">
      <div class="menu-header">
        <span class="menu-spark"></span>
        <b>Pixie</b>
        <span class="menu-hint">Quick actions</span>
      </div>
      <div class="menu-quick-row">
        <button type="button" class="menu-item menu-action" data-action="panel" title="Open chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button type="button" class="menu-item menu-action needs-message" data-action="copy" title="Copy last message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <button type="button" class="menu-item menu-action" data-action="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.04H3v-4h.08A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.54a1.7 1.7 0 0 0 1.04-1.56V3h4v.08A1.7 1.7 0 0 0 15.1 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.46 9c.2.63.78 1.04 1.56 1.04H21v4h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg>
        </button>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Open Chat & Assistant</span>
      </div>
      <div class="menu-item" data-action="state-happy">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
        <span>Happy</span>
      </div>
      <div class="menu-item" data-action="state-focus">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
        <span>Focus Mode</span>
      </div>
      <div class="menu-item" data-action="state-sleep">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span>Rest</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </div>
      <div class="menu-item text-danger" data-action="hide">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        <span>Hide Pixie</span>
      </div>
    </div>
  </div>

  <script src="../themes/theme-manager.js"></script>
  <script src="../character/pet.js"></script>
  <script src="../audio/sound-effects.js"></script>
  <script src="pet-controller.js"></script>
</body>
</html>
